[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-acceptance-lab"
version = "1.0.0"
description = "Offline synthetic accounting reconciliation acceptance lab"
requires-python = ">=3.11"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]

[project.scripts]
aal = "aal.cli:main"
aal-gateway = "aal.gateway_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aal.data" = ["*.json"]
